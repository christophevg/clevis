# Keyring interpolation example configuration.
#
# Store the secret first (interactive prompt, not in shell history):
#   clevis keyring set clevis-example db-password
#
# Then run:  uv run python keyring_secrets.py

[database]
host = "localhost"
port = 5432
password = "${keyring:clevis-example/db-password}"

[app]
name = "MyApp"
